name = "corruption-takeover-rt"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Комнаты реального времени (WebSocket + Durable Objects)
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

